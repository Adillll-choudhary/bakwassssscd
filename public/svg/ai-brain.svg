<circle cx="160" cy="100" r="4"></circle>
<circle cx="145" cy="130" r="4"></circle>
<circle cx="125" cy="145" r="4"></circle>

<!-- top nodes -->
<circle cx="85" cy="45" r="4"></circle>
<circle cx="115" cy="45" r="4"></circle>

<!-- connections -->
