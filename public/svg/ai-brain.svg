<circle cx="100" cy="95" r="25"></circle>
<text x="100" y="102" font-size="14" text-anchor="middle" fill="black" stroke="none" font-family="Arial">AI</text>

<!-- left nodes -->
<circle cx="50" cy="70" r="4"></circle>
<circle cx="40" cy="100" r="4"></circle>
<circle cx="55" cy="130" r="4"></circle>
<circle cx="75" cy="145" r="4"></circle>

